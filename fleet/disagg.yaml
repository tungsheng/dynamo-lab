# dynamo-lab :: fleet :: DISAGGREGATED profile  (nvidia.com/v1beta1, the headline topology, ADR 0007)
#
# !! MIGRATED to v1beta1 — NOT LIVE-VALIDATED !!
# The v1alpha1 form of this manifest is what served on EKS 1.36 (experiment B: frontend + prefill +
# decode + planner Ready, planner autoscaling loop live). This v1beta1 rewrite is verified against
# the ai-dynamo/dynamo v1.3.0 CRD schema + Go API types from primary sources, but NOT applied to a
# cluster. The conversion webhook serves both versions at v1.3.0, so the next `make up` validates it.
# Rollback: the v1alpha1 form is in git history. See PROGRESS.md (v1beta1 migration) + fleet/README.md.
#
# v1beta1 shape vs v1alpha1 (same mapping as fleet/agg.yaml's header):
#   spec.services{map} -> spec.components[list] (REQUIRED `name`); componentType/subComponentType ->
#   `type`; resources/envs/extraPodSpec.mainContainer -> podTemplate.spec.containers[name: main];
#   extraPodSpec.nodeSelector/tolerations -> podTemplate.spec.*. Disaggregation is now the component
#   `type`: prefill worker -> type: prefill, decode worker -> type: decode (no --disaggregation via
#   subComponentType). The --disaggregation-mode mocker CLI arg is unchanged.
#
# SEPARATE prefill + decode Mocker pools that exchange KV cache, plus Frontend (OpenAI API + KV
# router) and Planner (autoscaler, experiment B). Workers are the GPU-free mocker.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mocker-disagg
  namespace: dynamo
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: fleet
    dynamo-lab/topology: disaggregated
  annotations:
    # Verified v1.3.0: opts into legacy etcd/KV-store discovery (see agg.yaml header).
    nvidia.com/dynamo-discovery-backend: etcd
spec:
  # VERIFY (live): backendFramework enum is sglang|vllm|trtllm — no `mocker`. Omitted (+optional);
  # our container specifies dynamo.mocker. If the DCD generator needs a backend, set vllm. See agg.yaml.
  components:
    # ---------------------------------------------------------------------------------
    # Frontend: OpenAI-compatible HTTP API on :8000, KV-aware router. Service name = mocker-disagg-
    # frontend (name: Frontend -> <dgd>-frontend, keeps FRONTEND_URL stable).
    # ---------------------------------------------------------------------------------
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8000
                  name: http
                - containerPort: 8081
                  name: metrics # binds via DYN_SYSTEM_PORT=8081 below
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-frontend
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"

    # ---------------------------------------------------------------------------------
    # Planner: autoscaler (experiment B). Scales prefill and decode pools independently via the
    # KubernetesConnector ("environment":"kubernetes"). Stays on the system nodes (no nodeSelector).
    # ---------------------------------------------------------------------------------
    - name: Planner
      type: planner
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8081
                  name: metrics # planner Prometheus metrics bind PLANNER_PROMETHEUS_PORT=8081 (env below)
                # The operator adds a `httpGet /live port=system` probe to the planner; its system
                # server is on the operator stock default 9090 (distinct from the metrics port).
                # UNVALIDATED — confirm the planner serves /live on 9090 during a disagg bring-up.
                - containerPort: 9090
                  name: system
              env:
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                # v1.3.0: the planner serves metrics on PLANNER_PROMETHEUS_PORT (default 9085), not
                # DYN_SYSTEM_PORT — override to 8081 to match the `metrics` port or the scrape is dead.
                - name: PLANNER_PROMETHEUS_PORT
                  value: "8081"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-planner
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.planner
              args:
                # v1.3.0 (planner_config.py): optimization_target "load" REQUIRES prefill/decode
                # threshold keys, so we use "throughput" (default). For target!="sla" the planner
                # force-enables load scaling — backend-agnostic, load-driven autoscaling (experiment B).
                # prefill/decode_engine_num_gpu are required by the planner's budget init (mocker: 1).
                - --config
                - >-
                  {"environment": "kubernetes", "backend": "mocker",
                  "optimization_target": "throughput", "enable_load_scaling": true,
                  "enable_throughput_scaling": false,
                  "load_adjustment_interval_seconds": 10,
                  "prefill_engine_num_gpu": 1, "decode_engine_num_gpu": 1}

    # ---------------------------------------------------------------------------------
    # MockerPrefillWorker: prefill-only pool. v1beta1 type: prefill (was componentType: worker +
    # subComponentType: prefill); the mocker still takes --disaggregation-mode prefill.
    # ---------------------------------------------------------------------------------
    - name: MockerPrefillWorker
      type: prefill
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                # Named `system` so the operator's `httpGet /live port=system` worker probe resolves
                # (DYN_SYSTEM_PORT=8081 serves /live + /metrics on 8081). Diagnosed live 2026-07-28.
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-mocker-prefill
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - prefill
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D

    # ---------------------------------------------------------------------------------
    # MockerDecodeWorker: decode-only pool. v1beta1 type: decode; mocker --disaggregation-mode decode.
    # ---------------------------------------------------------------------------------
    - name: MockerDecodeWorker
      type: decode
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-mocker-decode
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - decode
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D
