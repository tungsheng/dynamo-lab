# dynamo-lab :: fleet :: TRACK G — Grove gang-scheduling scale profile  (nvidia.com/v1beta1, ADR 0009)
#
# !! MIGRATED to v1beta1 — NOT LIVE-VALIDATED !! (this profile has never been live-validated in
# EITHER apiVersion — see PROGRESS.md Track G). Verified against the ai-dynamo/dynamo v1.3.0 CRD
# schema + Go API types from primary sources; validate on the live Track G / experiment-A session.
#
# A DERIVED COPY of fleet/disagg.yaml (keep the two in sync — same components, containers, env,
# ports, images, worker node-steering, and mocker args, in the v1beta1 spec.components shape). Only
# THREE deltas make this the Track G profile, all GPU-free — see platform/grove/README.md + ADR 0009:
#   1. metadata.name is `mocker-grove` (a distinct DGD name + a `dynamo-lab/track: grove` label, so
#      `kubectl get dgd` tells the tracks apart) — deploy one topology at a time, though: this shares
#      the tainted `workers` NodePool and the OTEL service names with disagg.
#   2. Two annotations wire the operator's Grove path (Grove is selected by default once
#      global.grove.enabled is set at operator install — platform.sh install_grove / GROVE=1):
#        - nvidia.com/enable-grove: makes Track G's intent explicit (set "false" to fall back to LWS).
#        - nvidia.com/kai-scheduler-queue: RESOLVES THE QUEUE-NAME GOTCHA. The operator default is
#          `dynamo`, but KAI only auto-creates a leaf queue `default-queue`; a pod pointing at a
#          missing queue never schedules. We point at `default-queue` (option (b) in the README).
#   3. The prefill/decode pools default to replicas: 3 (was 1) — the gang-pressure knob. Grove
#      schedules the whole PodCliqueSet all-or-nothing, so raise these (or shrink the Karpenter
#      `workers` pool) to observe gang-blocked `Pending` + multi-level autoscaling.
#
# The frontend Service is `mocker-grove-frontend:8000`; to load it, override FRONTEND_URL. Grove/KAI
# must be installed + enabled first: `GROVE=1 make platform-up` or `make track-g-up`.
# VERIFY (live): confirm the operator renders this DGD as a Grove PodCliqueSet and the queue resolves.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mocker-grove
  namespace: dynamo
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: fleet
    dynamo-lab/topology: disaggregated
    dynamo-lab/track: grove
  annotations:
    # Verified v1.3.0: opts into legacy etcd/KV-store discovery (see agg.yaml header).
    nvidia.com/dynamo-discovery-backend: etcd
    # Track G (ADR 0009). Grove is the operator default once global.grove.enabled is set; "true"
    # states the intent. The queue MUST be one KAI actually has — `default-queue` is auto-created,
    # whereas the operator default `dynamo` is not (the queue-name gotcha). See platform/grove/.
    nvidia.com/enable-grove: "true"
    nvidia.com/kai-scheduler-queue: default-queue
spec:
  # VERIFY (live): backendFramework enum is sglang|vllm|trtllm — no `mocker`. Omitted (+optional);
  # our container specifies dynamo.mocker. If the DCD generator needs a backend, set vllm. See agg.yaml.
  components:
    # ---------------------------------------------------------------------------------
    # Frontend: OpenAI-compatible HTTP API on :8000, KV-aware router.
    # ---------------------------------------------------------------------------------
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8000
                  name: http
                - containerPort: 8081
                  name: metrics # binds via DYN_SYSTEM_PORT=8081 below
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-frontend
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"

    # ---------------------------------------------------------------------------------
    # Planner: autoscaler. Stays on the system nodes (no nodeSelector).
    # ---------------------------------------------------------------------------------
    - name: Planner
      type: planner
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8081
                  name: metrics # PLANNER_PROMETHEUS_PORT=8081 (env below)
                - containerPort: 9090
                  name: system # operator /live probe port (UNVALIDATED — confirm 9090)
              env:
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: PLANNER_PROMETHEUS_PORT
                  value: "8081"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-planner
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.planner
              args:
                - --config
                - >-
                  {"environment": "kubernetes", "backend": "mocker",
                  "optimization_target": "throughput", "enable_load_scaling": true,
                  "enable_throughput_scaling": false,
                  "load_adjustment_interval_seconds": 10,
                  "prefill_engine_num_gpu": 1, "decode_engine_num_gpu": 1}

    # ---------------------------------------------------------------------------------
    # MockerPrefillWorker: prefill-only pool (type: prefill). replicas: 3 = Track G gang-pressure knob.
    # ---------------------------------------------------------------------------------
    - name: MockerPrefillWorker
      type: prefill
      replicas: 3 # Track G gang-pressure knob (was 1 in disagg) — raise to gang-block / force node scaling
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-mocker-prefill
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - prefill
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D

    # ---------------------------------------------------------------------------------
    # MockerDecodeWorker: decode-only pool (type: decode). replicas: 3 = Track G gang-pressure knob.
    # ---------------------------------------------------------------------------------
    - name: MockerDecodeWorker
      type: decode
      replicas: 3 # Track G gang-pressure knob (was 1 in disagg) — raise to gang-block / force node scaling
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-mocker-decode
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - decode
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D
