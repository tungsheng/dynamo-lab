# dynamo-lab :: fleet :: AGGREGATED profile  (nvidia.com/v1beta1)
#
# !! MIGRATED to v1beta1 — NOT LIVE-VALIDATED !!
# The v1alpha1 form of this manifest is what actually served on EKS 1.36 (experiments B/C). This
# v1beta1 rewrite is verified against the ai-dynamo/dynamo v1.3.0 CRD schema + Go API types from
# primary sources (deploy/operator/api/v1beta1/*, samples/v1beta1/dgd-gms-failover.yaml), but has
# NOT been applied to a cluster. The operator's conversion webhook serves BOTH versions at v1.3.0,
# so the next `make up` is the validation. Rollback: the v1alpha1 form is in git history. See
# PROGRESS.md (v1beta1 migration) and fleet/README.md.
#
# v1beta1 shape vs the old v1alpha1:
#   spec.services{map}                     -> spec.components[list], each with a REQUIRED `name`
#   componentType / subComponentType       -> type (frontend|worker|prefill|decode|planner|epp;
#                                             prefill/decode are first-class — no subComponentType)
#   resources / envs / extraPodSpec.mainContainer
#       -> podTemplate.spec.containers[name: main].{resources,env,image,ports,command,args,workingDir}
#   extraPodSpec.nodeSelector / .tolerations -> podTemplate.spec.{nodeSelector,tolerations}
#   the three nvidia.com/* metadata annotations carry over unchanged.
#
# One aggregated Mocker worker pool (each worker does BOTH prefill and decode); no Planner (its
# KubernetesConnector needs the prefill+decode split — experiment B runs on disagg.yaml, ADR 0007).
# Workers are the GPU-free mocker (`python3 -m dynamo.mocker`); dynamo-planner:1.3.0 ships it.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mocker-agg
  namespace: dynamo
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: fleet
    dynamo-lab/topology: aggregated
  annotations:
    # Verified v1.3.0: opts into legacy etcd/KV-store discovery (consts.go
    # KubeAnnotationDynamoDiscoveryBackend). K8s-native discovery is the default; omit to use it.
    nvidia.com/dynamo-discovery-backend: etcd
spec:
  # VERIFY (live): the v1beta1 backendFramework enum at v1.3.0 is sglang|vllm|trtllm — there is NO
  # `mocker` value. Our container fully specifies `python3 -m dynamo.mocker`, so backendFramework is
  # OMITTED (it is +optional in the CRD). If the operator's DCD generator rejects a component that
  # has no resolvable backend, set `backendFramework: vllm` here as a placeholder (we override the
  # container command anyway).
  components:
    # ---------------------------------------------------------------------------------
    # Frontend: OpenAI-compatible HTTP API on :8000, KV-aware router.
    # Service name = <dgd-name>-<lowercase(name)> = mocker-agg-frontend, so keep name: Frontend to
    # keep the load runner's FRONTEND_URL = mocker-<topology>-frontend (verified v1.3.0: graph.go
    # GetDCDResourceName + NormalizeKubeResourceName — derives from `name`, not `type`).
    # ---------------------------------------------------------------------------------
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main # v1beta1: the primary container MUST be named `main`
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8000
                  name: http
                # Named `metrics` so podmonitor-fleet.yaml reaches the Frontend; binds because
                # DYN_SYSTEM_PORT=8081 is set below (verified v1.3.0).
                - containerPort: 8081
                  name: metrics
              env:
                - name: DYN_ROUTER_MODE # KV-aware routing ON (needs the NATS event plane)
                  value: kv
                - name: DYN_SYSTEM_PORT # bind the frontend metrics surface on :8081
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-frontend
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"

    # ---------------------------------------------------------------------------------
    # MockerWorker: aggregated pool (each replica does BOTH prefill and decode; no
    # --disaggregation-mode). No Planner in agg — see the header + ADR 0007.
    # HF token: Qwen/Qwen3-0.6B is public (no token needed). If HuggingFace rate-limits pulls, add
    # `envFrom: [{secretRef: {name: hf-token-secret}}]` to this container (v1beta1 replaced the
    # v1alpha1 per-component `envFromSecret` string with the standard container envFrom).
    # ---------------------------------------------------------------------------------
    - name: MockerWorker
      type: worker
      replicas: 1
      podTemplate:
        spec:
          # Steer ONLY the mocker workers onto the tainted Karpenter `workers` NodePool (ADR 0008).
          # In v1beta1 nodeSelector/tolerations are standard PodSpec fields under podTemplate.spec.
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                # Named `system` (NOT `metrics`): the operator adds a `httpGet /live port=system`
                # startup probe to worker components; with DYN_SYSTEM_PORT=8081 the system server
                # serves /live + /metrics on 8081. podmonitor-fleet.yaml scrapes `system` too.
                # Diagnosed live on EKS 1.36, 2026-07-28.
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-mocker-worker
                - name: DYN_MOCKER_SPEEDUP_RATIO # referenced from args via $(VAR) expansion
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                # v1.3.0: --num-workers is a valid mocker flag (default 1; upstream scales via pod
                # replicas), so "1" is a harmless no-op kept per the shared spec.
                - --num-workers
                - "1"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                # v1.3.0: --planner-profile-data is OPTIONAL; kept to match upstream (H200_TP1P_TP1D
                # ships in the image).
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D
