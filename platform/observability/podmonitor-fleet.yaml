# podmonitor-fleet.yaml
# PodMonitor for the Dynamo fleet component metrics.
#
# The Dynamo operator does NOT ship a PodMonitor for the mocker fleet (fleet/README.md
# flags this as unverified), so this lab provides one: Prometheus scrapes each fleet
# component pod's DYN_SYSTEM_PORT metrics endpoint (dynamo_component_* series).
#
# Discovered cluster-wide because kube-prometheus-stack is installed with
# podMonitorSelectorNilUsesHelmValues=false + empty namespace selectors (see
# values-kube-prometheus-stack.yaml). Applied by scripts (platform.sh install_observability).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dynamo-fleet
  namespace: dynamo
  labels:
    app.kubernetes.io/part-of: dynamo-lab
spec:
  namespaceSelector:
    matchNames:
      - dynamo
  selector:
    matchExpressions:
      # Verified v1.3.0: nvidia.com/dynamo-component-type is the operator's component-type label
      # key (consts.go). `Exists` matches every fleet component pod (frontend/worker/planner).
      - key: nvidia.com/dynamo-component-type
        operator: Exists
  podMetricsEndpoints:
    # The named `metrics` port is 8081 on every fleet pod (fleet/*.yaml). Verified v1.3.0: the
    # operator gives workers + Planner a stock system port of 9090 and leaves the Frontend's
    # system server DISABLED by default (DYN_SYSTEM_PORT defaults to -1). This lab sets
    # DYN_SYSTEM_PORT=8081 (Frontend + workers) and PLANNER_PROMETHEUS_PORT=8081 (Planner, whose
    # metrics default is 9085), so every component serves metrics on 8081 and one PodMonitor
    # covers them all.
    # Fleet components name their :8081 DYN_SYSTEM_PORT endpoint `system` (worker components:
    # REQUIRED so the operator's `httpGet /live port=system` probe resolves) or `metrics`
    # (Frontend). Scrape BOTH names — a pod is matched only by the endpoint whose named port it
    # actually declares, so this covers every component. Fixed live on EKS 1.36, 2026-07-28.
    - port: system
      path: /metrics
      interval: 15s
    - port: metrics
      path: /metrics
      interval: 15s
