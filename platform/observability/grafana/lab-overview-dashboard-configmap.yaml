      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "refresh": "10s",
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "name": "Annotations & Alerts",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "type": "dashboard",
            "iconColor": "rgba(0, 211, 255, 1)"
          },
          {
            "name": "Chaos experiments",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "type": "tags",
            "tags": [
              "chaos",
              "dynamo-lab"
            ],
            "iconColor": "red",
            "matchAny": false
          },
          {
            "name": "Load profile changes",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "type": "tags",
            "tags": [
              "k6",
              "load"
            ],
            "iconColor": "yellow",
            "matchAny": true
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
