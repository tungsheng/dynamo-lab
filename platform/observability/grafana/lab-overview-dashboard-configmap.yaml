# lab-overview dashboard — custom to dynamo-lab.
# Overlays k6 client-side load, the Chaos-Mesh annotation markers, and the key
# fleet/planner/router metrics on one screen so an experiment can be read at a
# glance: fault injected (red marker) -> queue climbs / errors spike -> planner
# reacts -> latency recovers.
#
# Imported by the Grafana dashboard sidecar via the grafana_dashboard: "1" label.
# Panels use the built-in Prometheus datasource (uid: prometheus). Chaos and load
# markers come from Grafana annotations (posted by the chaos-annotation bridge and,
# optionally, by the load runner) tagged `chaos` / `k6`.
#
# VERIFY: k6 latency series names (k6_http_req_duration_p95/p90/avg) and
#         k6_http_req_failed_total depend on the k6 remote-write output mode
#         (per-stat gauges vs native histograms). See load/ profiles + README.
# VERIFY: karpenter_nodes_allocatable / kube_pod_status_phase names against the
#         installed Karpenter + kube-state-metrics versions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-lab-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: dynamo-lab
  annotations:
    grafana_folder: "Dynamo Lab"
data:
  lab-overview-dashboard.json: |-
