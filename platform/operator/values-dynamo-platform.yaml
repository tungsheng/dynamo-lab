# values-dynamo-platform.yaml
# Helm values for the NVIDIA Dynamo Kubernetes Platform chart (dynamo-platform),
# which deploys the Dynamo operator + supporting RBAC into namespace `dynamo-system`.
#
# In this lab we run our OWN highly-available coordination plane (etcd + NATS) in the
# `dynamo` namespace (see platform/coordination/), so we DISABLE the etcd/NATS
# subcharts that dynamo-platform would otherwise install. The fleet's DynamoGraphDeployment
# points at etcd.dynamo / nats.dynamo directly (see fleet/).
#
# Chart: dynamo-platform   Repo: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
# Namespace: dynamo-system
#
# Verified v1.3.0: chart dynamo-platform version 1.3.0 (deploy/helm/charts/platform/Chart.yaml),
#         the latest stable release. As of v1.3.0 the CRDs ship in the operator image and are
#         applied by its crd-apply init container — there is no standalone dynamo-crds chart.
# Verified v1.3.0: the global toggle keys below (global.etcd.install / global.nats.install /
#         global.grove.install / global.kai-scheduler.install) match the chart's dependency
#         conditions (Chart.yaml). global.nats.install defaults true since 1.1.0, so the
#         explicit false matters.

global:
  # We manage etcd + NATS ourselves (HA, ns `dynamo`). Do NOT let the platform chart install them.
  # Verified v1.3.0: global.{etcd,nats,grove,kai-scheduler}.install are the chart's dependency
  # condition keys (Chart.yaml); install:false disables each bundled subchart.
  etcd:
    install: false
  nats:
    install: false
  # Optional schedulers/orchestrators shipped with the platform chart — not needed for a
  # CPU-only mocker lab. Keep them off to minimize moving parts.
  grove:
    install: false
  kai-scheduler:
    install: false

dynamo-operator:
  enabled: true

  # This lab runs its own HA etcd + NATS in ns `dynamo` (global.{etcd,nats}.install=false above),
  # so the operator has no bundled coordination plane to auto-discover — point it at ours.
  # Verified v1.3.0 (platform values.yaml): dynamo-operator.natsAddr / etcdAddr are the keys for
  # an external instance (there are no externalNats/externalEtcd keys). natsAddr is required —
  # the operator injects NATS_SERVER from it; etcdAddr matters because the fleet opts into etcd
  # discovery (nvidia.com/dynamo-discovery-backend=etcd).
  natsAddr: "nats://nats.dynamo.svc.cluster.local:4222"
  etcdAddr: "http://etcd.dynamo.svc.cluster.local:2379"

  # The operator must reconcile DynamoGraphDeployments that live in the `dynamo` namespace
  # while the operator itself runs in `dynamo-system`. By default the operator is restricted
  # to its own release namespace, which would leave our fleet unmanaged. Disable the
  # restriction so it watches all namespaces (fine for a single-tenant lab).
  # Verified v1.3.0: namespaceRestriction.enabled=false runs the operator CLUSTER-WIDE (watches
  # all namespaces) — what the lab needs. Restricted mode (enabled: true + targetNamespace) is
  # single-namespace, "development and testing only", and also requires upgradeCRD=false.
  namespaceRestriction:
    enabled: false

  # Expose operator metrics to Prometheus. kube-prometheus-stack is configured with
  # serviceMonitorSelectorNilUsesHelmValues=false so it will pick this ServiceMonitor up.
  # Verified v1.3.0: the operator subchart controls this via `metricsService.enabled`
  # (null=auto-detect — Service always, ServiceMonitor if prometheus-operator CRDs exist;
  # true=always create both), NOT a metrics.serviceMonitor block. `true` forces both, and the
  # lab installs kube-prometheus-stack so the CRDs are present.
  metricsService:
    enabled: true

  # Label first-party resources for lab-wide selection/annotation.
  commonLabels:
    app.kubernetes.io/part-of: dynamo-lab
