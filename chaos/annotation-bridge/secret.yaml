# Grafana credentials for the chaos annotation bridge — PLACEHOLDER.
#
# Do NOT commit real credentials. Replace the values (or create this Secret out-of-band,
# e.g. `kubectl -n chaos-mesh create secret generic chaos-annotation-bridge-grafana
# --from-literal=GRAFANA_TOKEN=<token>`) before applying the Deployment.
#
# Provide EITHER a service-account token (preferred) OR basic-auth user/password.
# VERIFY auth: kube-prometheus-stack's bundled Grafana defaults to admin/prom-operator
# (basic auth) unless overridden. The modern path is a Grafana service-account token with
# the "Annotation writer"/Editor role. Pick one and delete the unused keys.
apiVersion: v1
kind: Secret
metadata:
  name: chaos-annotation-bridge-grafana
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/name: chaos-annotation-bridge
type: Opaque
stringData:
  # Option A (preferred): Grafana service-account token.
  GRAFANA_TOKEN: "REPLACE_ME_WITH_GRAFANA_SERVICE_ACCOUNT_TOKEN"
  # Option B (fallback): basic auth. Leave empty if using the token above.
  GRAFANA_USER: ""
  GRAFANA_PASSWORD: ""
