# benchmarks/router :: fleet-base  (nvidia.com/v1beta1) — the router-benchmark fleet
#
# Derived from fleet/disagg.yaml, with three deliberate benchmark deltas (ADR 0010):
#   1. NO Planner — replicas are FIXED, so routing quality (not autoscaling) is the only
#      moving part. A planner scaling pods mid-run would confound the TTFT comparison.
#   2. prefill + decode replicas RAISED to 4 — the router needs several workers to choose
#      among, or "which worker" is not a real decision and every policy looks identical.
#   3. Frontend carries NO DYN_ROUTER_MODE here — scripts/bench.sh replaces the single router-env
#      marker line with the per-arm router env (mode + overlap-score-credit + optional
#      session/predict/load-aware), so one base serves every arm. The DGD name/labels carry the
#      per-arm BENCH_ARM token for cold, isolated arms.
#
# The mocker keeps prefix caching ON (its default) and a FINITE --speedup-ratio: a cache hit
# shrinks effective prefill ISL and still yields a real, wall-clock-compressed TTFT delta.
# --speedup-ratio 0 (infinite speedup / no delays) would erase the very signal we measure.
#
# Rendered by scripts/bench.sh: envsubst expands the BENCH_ARM and DYNAMO_VERSION tokens, then the
# single router-env marker line is replaced with the arm's router env entries (awk, no new deps).
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mocker-bench-${BENCH_ARM}
  namespace: dynamo
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: benchmark
    dynamo-lab/topology: disaggregated
    dynamo-lab/benchmark: router
    dynamo-lab/arm: "${BENCH_ARM}"
  annotations:
    nvidia.com/dynamo-discovery-backend: etcd
spec:
  components:
    # -------------------------------------------------------------------------------
    # Frontend: OpenAI API on :8000 + KV-aware router. INFRA env only here; bench.sh
    # appends the per-arm router env (DYN_ROUTER_MODE + policy flags) onto this container.
    # Service name mocker-bench-${BENCH_ARM}-frontend (name: Frontend -> <dgd>-frontend).
    # -------------------------------------------------------------------------------
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              ports:
                - containerPort: 8000
                  name: http
                - containerPort: 8081
                  name: metrics
              env:
                # scripts/bench.sh replaces the marker line below with this arm's router policy
                # (DYN_ROUTER_MODE + overlap-score-credit + optional session/predict/load-aware).
                # __BENCH_ROUTER_ENV__  (replaced per-arm; keep this marker line unique)
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                # Router KV block size, aligned with the mocker --block-size (16) so prefix-overlap
                # accounting matches the workers' cache. VERIFY(live): this env maps to the
                # frontend --kv-cache-block-size on the pinned release.
                - name: DYN_KV_CACHE_BLOCK_SIZE
                  value: "16"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-bench-frontend
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"

    # -------------------------------------------------------------------------------
    # MockerPrefillWorker: prefill-only pool, replicas: 4 so the router has a real choice
    # of prefill workers to route among (this is where prefix-cache locality is decided).
    # -------------------------------------------------------------------------------
    - name: MockerPrefillWorker
      type: prefill
      replicas: 4
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-bench-prefill
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                # Engine KV block size — MUST match the frontend DYN_KV_CACHE_BLOCK_SIZE so the
                # router's prefix-overlap accounting lines up with the workers' cache (follow-up
                # for the no-signal result). 16 matches the upstream mocker example.
                - --block-size
                - "16"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - prefill
                # Prefix caching is ON by default; --block-size (16) above is aligned with the
                # frontend DYN_KV_CACHE_BLOCK_SIZE. Do NOT pass --speedup-ratio 0 (removes delays,
                # erasing the cache-hit TTFT signal).
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D

    # -------------------------------------------------------------------------------
    # MockerDecodeWorker: decode-only pool, replicas: 4.
    # -------------------------------------------------------------------------------
    - name: MockerDecodeWorker
      type: decode
      replicas: 4
      podTemplate:
        spec:
          nodeSelector:
            dynamo-lab/node-pool: workers
          tolerations:
            - key: dynamo-lab/workers
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION} # v1.3.0: ships the mocker wheel, CPU-only
              workingDir: /workspace
              ports:
                - containerPort: 8081
                  name: system
              env:
                - name: DYN_SYSTEM_PORT
                  value: "8081"
                - name: ETCD_ENDPOINTS
                  value: http://etcd.dynamo.svc.cluster.local:2379
                - name: NATS_SERVER
                  value: nats://nats.dynamo.svc.cluster.local:4222
                - name: OTEL_EXPORT_ENABLED
                  value: "true"
                - name: DYN_LOGGING_JSONL
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
                - name: OTEL_SERVICE_NAME
                  value: dynamo-bench-decode
                - name: DYN_MOCKER_SPEEDUP_RATIO
                  value: "10"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              command:
                - python3
                - -m
                - dynamo.mocker
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "1"
                # Engine KV block size — MUST match the frontend DYN_KV_CACHE_BLOCK_SIZE so the
                # router's prefix-overlap accounting lines up with the workers' cache (follow-up
                # for the no-signal result). 16 matches the upstream mocker example.
                - --block-size
                - "16"
                - --speedup-ratio
                - "$(DYN_MOCKER_SPEEDUP_RATIO)"
                - --disaggregation-mode
                - decode
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D
