# benchmarks/router :: aiperf-job — replay the agentic trace against ONE arm's Frontend
#
# In-cluster aiperf run (the ADR 0005 "realistic benchmark mode"), modeled on
# load/k6-job.yaml. It replays a session-grouped, shared-prefix agentic trace at fixed
# concurrency against the arm's Frontend and writes aiperf's TTFT/TPOT/ITL/E2EL export.
# scripts/bench.sh renders ${BENCH_ARM}/${BENCH_FRONTEND_URL} via envsubst before apply.
#
# This is a SCAFFOLD: the pieces marked VERIFY are the ones to pin on the first live run —
# the runner image, the exact aiperf/agent_benchmark.py invocation, the trace source, and
# how the profile_export_aiperf.json is collected. Reuse Dynamo's upstream benchmarks/router/
# harness (agent_benchmark.py + the Mooncake FAST'25 toolagent trace) rather than reinventing.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-bench-${BENCH_ARM}
  namespace: load
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: benchmark
    dynamo-lab/benchmark: router
    dynamo-lab/arm: "${BENCH_ARM}"
spec:
  backoffLimit: 0            # a benchmark run is not "retryable"; rerun via make bench-router-run
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dynamo-lab
        app.kubernetes.io/component: benchmark
        dynamo-lab/arm: "${BENCH_ARM}"
    spec:
      restartPolicy: Never
      # VERIFY: fetch benchmarks/router/ (agent_benchmark.py) + the Mooncake FAST'25 toolagent
      # trace into /work. Pin the Dynamo ref to DYNAMO_VERSION and the trace to a known commit.
      # Alternatives: bake a benchmark image, or mount a pre-fetched trace from a PVC/ConfigMap.
      initContainers:
        - name: fetch-harness
          image: alpine/git:latest   # VERIFY: pin a digest/tag you trust
          command:
            - sh
            - -c
            - |
              set -eu
              echo "VERIFY: clone ai-dynamo/dynamo @ v${DYNAMO_VERSION} -> /work/dynamo (benchmarks/router/)"
              echo "VERIFY: fetch Mooncake FAST'25 toolagent_trace.jsonl -> /work/trace.jsonl"
              # git clone --depth 1 --branch "v${DYNAMO_VERSION}" https://github.com/ai-dynamo/dynamo /work/dynamo
              # wget -O /work/trace.jsonl <mooncake toolagent_trace.jsonl raw URL>
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: aiperf
          # VERIFY: an image that carries aiperf + benchmarks/router/agent_benchmark.py. The
          # dynamo runtime image may already; otherwise pip install aiperf into a python base.
          image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:${DYNAMO_VERSION}
          imagePullPolicy: IfNotPresent
          workingDir: /work
          command:
            - sh
            - -c
            - |
              set -eu
              echo "arm=${BENCH_ARM} target=$FRONTEND_URL model=$MODEL conc=$CONCURRENCY"
              # VERIFY (live): the exact upstream invocation. Sketch:
              #   python3 /work/dynamo/benchmarks/router/agent_benchmark.py \
              #     --url "$FRONTEND_URL" --model "$MODEL" \
              #     --trace /work/trace.jsonl --concurrency "$CONCURRENCY" \
              #     --artifact-dir /work/out
              # aiperf writes profile_export_aiperf.json (TTFT/TPOT/ITL/E2EL) under the artifact dir.
              echo "VERIFY: run agent_benchmark.py (aiperf) and emit /work/out/profile_export_aiperf.json"
          env:
            - name: FRONTEND_URL
              value: "${BENCH_FRONTEND_URL}"
            - name: MODEL
              value: "Qwen/Qwen3-0.6B"
            # Fixed concurrency point. Sweep by running the arm at several values and clearing
            # KV state between points (a fresh fleet per run already does this — see README).
            - name: CONCURRENCY
              value: "32"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: /work
      # VERIFY: collect /work/out/profile_export_aiperf.json off the pod (kubectl cp, or write
      # to a PVC/S3) into results/<arm>[/credit] for benchmarks/router/analysis/compare.py.
      volumes:
        - name: work
          emptyDir: {}
