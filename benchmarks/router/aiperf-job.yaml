# benchmarks/router :: aiperf-job — replay the agentic trace against ONE arm's Frontend
#
# In-cluster aiperf run (the ADR 0005 "realistic benchmark mode"). Replays the Mooncake
# FAST'25 toolagent trace against the arm's Frontend and prints aiperf's TTFT/TPOT/ITL/E2EL
# export to stdout for collection. scripts/bench.sh renders ${BENCH_ARM}/${BENCH_FRONTEND_URL}
# via envsubst before apply.
#
# Pinned to the primary sources (Dynamo v1.3.0 benchmarks/router): aiperf==0.10.0, the
# `aiperf profile ... --custom-dataset-type mooncake_trace` form, and the toolagent trace.
# We call `aiperf profile` DIRECTLY (not agent_benchmark.py) so the only dependency is aiperf
# itself — agent_benchmark.py additionally needs the data-generator package installed.
# Validated live 2026-08-06: this Job runs end-to-end and emits profile_export_aiperf.json.
#
# TRACE_MODE=session (default) generates a session-grouped multi-turn trace via
# make_session_trace.py (mounted from configmap bench-router-gen) so the session-affinity arm is
# meaningful. TRACE_MODE=toolagent uses the fetched single-turn Mooncake trace (shared prefixes via
# hash_ids, no session_id) — kv-overlap vs cache-blind only. See benchmarks/router/README.md.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-bench-${BENCH_ARM}
  namespace: load
  labels:
    app.kubernetes.io/part-of: dynamo-lab
    app.kubernetes.io/component: benchmark
    dynamo-lab/benchmark: router
    dynamo-lab/arm: "${BENCH_ARM}"
spec:
  backoffLimit: 0            # a benchmark run is not "retryable"; rerun via make bench-router-run
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dynamo-lab
        app.kubernetes.io/component: benchmark
        dynamo-lab/arm: "${BENCH_ARM}"
    spec:
      restartPolicy: Never
      containers:
        - name: aiperf
          # Validated live 2026-08-06: python:3.12-slim + pip install aiperf==0.10.0 works (adds
          # ~90s startup). No published image is confirmed to bundle aiperf; bake one to skip pip.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: ARM
              value: "${BENCH_ARM}"
            - name: FRONTEND_URL             # aiperf --url takes the BASE url (no /v1)
              value: "${BENCH_FRONTEND_URL}"
            - name: MODEL
              value: "Qwen/Qwen3-0.6B"
            - name: TRACE_URL
              value: "https://raw.githubusercontent.com/kvcache-ai/Mooncake/d21da178bae8db9651cf18a76824c084145fc725/FAST25-release/traces/toolagent_trace.jsonl"
            - name: CONCURRENCY
              value: "32"
            # TRACE_MODE: session (generated multi-turn sessions — the sticky/kv comparison) or
            # toolagent (the fetched single-turn Mooncake trace). The follow-up defaults to session.
            - name: TRACE_MODE
              value: "session"
            - name: SESSIONS
              value: "200"
            - name: TURNS
              value: "5"
            - name: DELAY_MS
              value: "0"
            # toolagent mode only: rows to load from the fetched trace. aiperf materializes the whole
            # dataset in memory, so the full 23,608-row trace OOMs a small pod (live 2026-08-06) —
            # subset to bound memory (a contiguous head preserves hash_ids prefix reuse).
            - name: TRACE_ROWS
              value: "2000"
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[aiperf-bench arm=$ARM mode=$TRACE_MODE] pip install aiperf==0.10.0"
              pip install --quiet --no-cache-dir aiperf==0.10.0
              if [ "$TRACE_MODE" = session ]; then
                echo "[aiperf-bench] generate session trace (sessions=$SESSIONS turns=$TURNS)"
                python /gen/make_session_trace.py --sessions "$SESSIONS" --turns "$TURNS" \
                  --delay-ms "$DELAY_MS" > /work/trace.jsonl
              else
                echo "[aiperf-bench] fetch + subset toolagent trace ($TRACE_ROWS rows)"
                python -c "import urllib.request,os; urllib.request.urlretrieve(os.environ['TRACE_URL'], '/work/trace.raw.jsonl')"
                head -n "$TRACE_ROWS" /work/trace.raw.jsonl > /work/trace.jsonl
              fi
              ROWS=$(wc -l < /work/trace.jsonl)
              echo "[aiperf-bench] using $ROWS trace rows"
              echo "[aiperf-bench] run vs $FRONTEND_URL (concurrency=$CONCURRENCY count=$ROWS)"
              # aiperf's --request-count defaults to a SMALL number (~10), so pass the trace's row
              # count explicitly or only a handful of requests are sent (live finding 2026-08-11).
              aiperf profile \
                --model "$MODEL" --tokenizer "$MODEL" --url "$FRONTEND_URL" \
                --endpoint-type chat --streaming \
                --input-file /work/trace.jsonl --custom-dataset-type mooncake_trace \
                --concurrency "$CONCURRENCY" --request-count "$ROWS" --random-seed 0 \
                --artifact-dir /work/out --extra-inputs ignore_eos:true --no-gpu-telemetry
              # Emit the export to stdout so `kubectl logs` collects it (the pod is gone after ttl,
              # so kubectl cp is unavailable). scripts/bench.sh slices between these markers.
              echo "===AIPERF-JSON-BEGIN==="
              cat /work/out/profile_export_aiperf.json
              echo "===AIPERF-JSON-END==="
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              # 4Gi headroom: aiperf holds the (subset) dataset + tokenized prompts in memory.
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: gen
              mountPath: /gen
      volumes:
        - name: work
          emptyDir: {}
        # make_session_trace.py, published by scripts/bench.sh as configmap bench-router-gen.
        # optional so TRACE_MODE=toolagent still runs without the configmap.
        - name: gen
          configMap:
            name: bench-router-gen
            optional: true
